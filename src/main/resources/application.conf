app {
    baseUrl = "https://webqa.mercdev.com"
    baseUrl = ${?APP_BASE_URL}
}

credentials {
    # No defaults on purpose: Configuration.Credentials fails fast if these are not set
    userEmail = ${?TEST_USER_EMAIL}
    password = ${?TEST_PASSWORD}
}

webdriver {
    browser = "chrome"
    browser = ${?WEBDRIVER_BROWSER}
    headless = false
    headless = ${?WEBDRIVER_HEADLESS}
    # Seconds, explicit waits
    timeout = 10
    timeout = ${?WEBDRIVER_TIMEOUT}
    gridUrl = "http://localhost:4444/wd/hub"
    gridUrl = ${?SELENIUM_GRID_URL}
    # Selenium Grid instead of a local browser. Gradle maps -Dremote=true to this key
    remote = false
    remote = ${?WEBDRIVER_REMOTE}
}

api {
    baseUrl = "https://webqa.mercdev.com/api/v1"
    baseUrl = ${?API_BASE_URL}
    # Seconds, connect and read timeouts
    timeout = 10
    timeout = ${?API_TIMEOUT}
}

petstore {
    baseUrl = "https://petstore3.swagger.io/api/v3"
    baseUrl = ${?PETSTORE_BASE_URL}
}

mock {
    wiremock {
        host = "localhost"
        host = ${?WIREMOCK_HOST}
        port = 9999
        port = ${?WIREMOCK_PORT}
    }
}
