name: Smoke Tests

# Docs-only changes cannot break the tests: skip the run. master is not protected, so no required check waits for it
on:
  push:
    branches: [ master ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    paths-ignore: [ '**.md', 'docs/**' ]
  workflow_dispatch:

# A newer push to the same PR cancels the outdated run. Runs on master are queued, not cancelled:
# cancelling one mid-way through deploy-report could leave GitHub Pages half-published
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java and Gradle Environment
        uses: ./.github/actions/java-setup

      - name: Run Detekt
        run: ./gradlew detekt detektStrict --continue

      - name: Upload Detekt Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: build/reports/detekt
          retention-days: 5

  # The shared stand goes down at times. Checking it first turns an outage into one clear error instead of
  # a page of failed tests; the test jobs are then skipped, so no report replaces the published one.
  # Fork PRs get no secrets, so the tests would fail on missing credentials: skipping this job skips them too
  stand-check:
    name: Test Stand Check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check that the WebQA stand answers
        env:
          # Any answer below 500 means the server is up: the API root may well be 401 or 404
          URLS: https://webqa.mercdev.com https://webqa.mercdev.com/api/v1/product/
        run: |
          for url in $URLS; do
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || true)
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
                echo "$url: HTTP $code"
                continue 2
              fi
              echo "$url: HTTP $code (attempt $attempt/3)"
              sleep 10
            done
            echo "::error title=Test stand unavailable::$url answered HTTP $code three times; the tests were not run"
            exit 1
          done

  api-tests:
    name: API Tests
    needs: stand-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
      pull-requests: write  # test-result summary comment on the PR
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java and Gradle Environment
        uses: ./.github/actions/java-setup

      - name: Run API Tests
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: ./gradlew test -PsuiteFile=src/test/resources/smoke-api.xml

      - name: Publish API Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: ${{ !cancelled() }}
        with:
          files: build/test-results/test/**/*.xml
          check_name: API Test Results

      - name: Upload Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: build/allure-results
          retention-days: 5

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            build/reports
            build/test-results
            build/logs
          retention-days: 5

  ui-tests:
    name: UI Tests
    needs: stand-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write  # test-result summary comment on the PR
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java and Gradle Environment
        uses: ./.github/actions/java-setup

      # --wait returns once the hub healthcheck reports a registered node (see docker-compose.yml)
      - name: Start Selenium Grid
        timeout-minutes: 3
        run: docker compose up -d --wait selenium-hub chrome

      - name: Run UI Tests
        timeout-minutes: 20
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: ./gradlew test -PsuiteFile=src/test/resources/smoke-ui.xml -Dremote=true

      - name: Publish UI Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: ${{ !cancelled() }}
        with:
          files: build/test-results/test/**/*.xml
          check_name: UI Test Results

      - name: Upload Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-ui
          path: build/allure-results
          retention-days: 5

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            build/reports
            build/test-results
            build/logs
          retention-days: 5

      - name: Selenium Grid Logs
        if: failure()
        run: docker compose logs selenium-hub chrome

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down

  allure-report:
    name: Allure Report
    needs: [ api-tests, ui-tests ]
    # Runs after failed tests too: a red run is when the report matters most. Not after a cancel:
    # a superseded run would only waste a runner
    if: ${{ !cancelled() && needs.api-tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java and Gradle Environment
        uses: ./.github/actions/java-setup

      - name: Download Allure Results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: build/allure-results
          merge-multiple: true

      # The previous report's history powers the trend graphs; the first deployment has none
      - name: Restore Report History
        if: github.event_name == 'push'
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p build/allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$SITE/history/$f" -o "build/allure-results/history/$f" || echo "No $f in the published report"
          done

      - name: Generate Allure Report
        run: ./gradlew allureReport

      - name: Upload Allure Report
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: build/reports/allure-report/allureReport
          retention-days: 5

      - name: Upload Pages Artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/reports/allure-report/allureReport

  deploy-report:
    name: Publish Allure Report
    needs: allure-report
    if: github.event_name == 'push' && needs.allure-report.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
