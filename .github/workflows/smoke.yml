name: Smoke Tests

on:
  push:
    branches: [ main, master, dev* ]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch/PR cancels the outdated run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Java and Gradle Environment
        uses: ./.github/actions/java-setup

      - name: Run Detekt
        run: ./gradlew detekt detektSecurityCheck --continue

      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-reports
          path: build/reports/detekt
          retention-days: 5

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Java and Gradle Environment
        uses: ./.github/actions/java-setup

      - name: Run API Tests
        id: run-api-tests
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: ./gradlew test -PsuiteFile=src/test/resources/smoke-api.xml

      - name: Publish API Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: always()
        with:
          files: build/test-results/test/**/*.xml
          check_name: API Test Results

      - name: Upload Test Reports
        if: failure() && steps.run-api-tests.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            build/reports
            build/test-results
            build/allure-results
          retention-days: 5

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Setup Java and Gradle Environment
        uses: ./.github/actions/java-setup

      - name: Start Selenium Grid
        run: docker compose up -d selenium-hub chrome

      - name: Check Docker containers
        run: |
          echo "Checking Docker containers..."
          docker ps
          docker logs selenium-hub
          CHROME_CONTAINER_ID=$(docker ps -q --filter "name=chrome")
          echo "Chrome container ID: $CHROME_CONTAINER_ID"
          docker logs "$CHROME_CONTAINER_ID"

      - name: Wait for Selenium Grid to be ready
        timeout-minutes: 3
        run: |
          echo "Waiting for Selenium Grid to become ready..."
          until curl -sf http://localhost:4444/wd/hub/status | grep -qE '"ready"\s*:\s*true'; do
            echo "Grid not ready yet, retrying in 3s..."
            curl -s http://localhost:4444/wd/hub/status 2>/dev/null || echo "  (endpoint not responding yet)"
            sleep 3
          done
          echo "Selenium Grid is ready"
          docker ps

      - name: Run UI Tests
        id: run-ui-tests
        timeout-minutes: 20
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: ./gradlew test -PsuiteFile=src/test/resources/smoke-ui.xml -Dremote=true

      - name: Publish UI Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3  # v2.24.0
        if: always()
        with:
          files: build/test-results/test/**/*.xml
          check_name: UI Test Results

      - name: Upload Test Reports
        if: failure() && steps.run-ui-tests.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            build/reports
            build/test-results
            build/allure-results
          retention-days: 5

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down
