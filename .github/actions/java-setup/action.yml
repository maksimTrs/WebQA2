name: 'Set up Java and Gradle'
description: 'Sets up the JDK and Gradle: dependency caching and Gradle wrapper validation'
inputs:
  java-version:
    description: 'Java version to set up'
    required: false
    default: '17'
  distribution:
    description: 'Java distribution to use'
    required: false
    default: 'temurin'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.distribution }}

    # Also validates gradle-wrapper.jar against the known checksums (validate-wrappers defaults to true)
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
      with:
        # MIT-licensed cache on top of actions/cache; the default "enhanced" provider is proprietary
        # and using it means accepting the Gradle Terms of Use
        cache-provider: basic
