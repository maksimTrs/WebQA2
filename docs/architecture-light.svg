  <title id="architecture-light-title">WebQA test framework architecture</title>
  <desc id="architecture-light-desc">UI tests drive the WebQA app through page objects and WebDriver (local or Selenium Grid); API tests call it through a shared REST Assured client, which also targets a WireMock container; Petstore tests use a generated OpenAPI client; all layers read one Typesafe configuration.</desc>
